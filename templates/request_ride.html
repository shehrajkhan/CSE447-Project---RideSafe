{% extends "base.html" %}
{% block title %}Request a ride - RideSafe{% endblock %}
{% block content %}
<div class="card">
    <h2>Where to?</h2>
    <p class="subtitle">Trip details are encrypted before they leave your session.</p>
    <form method="POST">
        <div class="field">
            <label>Pickup location</label>
            <input type="text" name="pickup" required autofocus>
        </div>
        <div class="field">
            <label>Drop-off location</label>
            <input type="text" name="dropoff" required>
        </div>
        <div class="field">
            <label>Time</label>
            <input type="text" name="timing" placeholder="e.g. Today, 5:30 PM" required>
        </div>
        <button type="submit" class="btn btn-primary">Request ride</button>
    </form>
    <div class="link-row"><a href="{{ url_for('trips.dashboard') }}">Back to dashboard</a></div>
</div>
{% endblock %}
