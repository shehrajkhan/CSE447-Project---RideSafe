{% extends "base.html" %}
{% block title %}Register - RideSafe{% endblock %}
{% block content %}
<div class="card">
    <h2>Create your account</h2>
    <p class="subtitle">Your details are encrypted before they're ever stored.</p>
    
    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <div class="field">
            <label>Username</label>
            <input type="text" name="username" required autofocus>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <div class="field">
            <label>Contact number</label>
            <input type="text" name="contact">
        </div>
        <div class="field">
            <label>I am a</label>
            <select name="role">
                <option value="rider">Rider</option>
                <option value="driver">Driver</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Create account</button>
    </form>
    <div class="link-row">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></div>
</div>
{% endblock %}
