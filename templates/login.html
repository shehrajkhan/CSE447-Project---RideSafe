{% extends "base.html" %}

{% block title %}Log in - RideSafe{% endblock %}

{% block content %}
<div class="card">
    <h2>Welcome back</h2>
    <p class="subtitle">Log in to request or track a ride.</p>
    
    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>

    <div class="link-row">
        No account yet? <a href="{{ url_for('auth.register') }}">Register</a>
    </div>

    <div style="margin-top: 16px; padding-top: 14px; border-top: 1px dashed #CBD5E1; text-align: center;">
        <a href="{{ url_for('admin.admin_login') }}" class="btn-admin-panel" style="display: inline-block; padding: 8px 16px; background: #1E293B; color: #FFFFFF; border-radius: 6px; font-weight: 500; font-size: 0.88rem; text-decoration: none;">
            <i class="fa-solid fa-user-shield"></i> Admin Panel
        </a>
    </div>
</div>
{% endblock %}
